<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 940" width="960" height="940" role="img" aria-labelledby="title desc">
  <title id="title">Self-RAG workflow</title>
  <desc id="desc">LangGraph nodes of runbook-copilot: contextualize, decide_retrieval, retrieve, grade, generate, support, revise, usefulness, commit_memory, with retry routing to rewrite_internal, rewrite_web, web_search and no_answer.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e4e7eb; }
    .node { fill: #f8fafc; stroke: #9aa5b1; stroke-width: 1.25; }
    .mem { fill: #f0faf4; stroke: #2f855a; stroke-width: 1.75; }
    .web { fill: #fdf8ee; stroke: #b7791f; stroke-width: 1.75; }
    .pill { fill: #1f2933; }
    .name.pill-text { fill: #ffffff; }
    .diamond { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.25; }
    .name { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2933; text-anchor: middle; }
    .label { font: 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #52606d; }
    .legend { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #52606d; }
    .edge { fill: none; stroke: #616e7c; stroke-width: 1.5; }
    .cond { stroke-dasharray: 5 4; }
    .head { fill: #616e7c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .node { fill: #161b22; stroke: #57606a; }
      .mem { fill: #0f2a1c; stroke: #3fb950; }
      .web { fill: #2b2111; stroke: #d29922; }
      .pill { fill: #e6edf3; }
      .diamond { fill: #161b22; stroke: #57606a; }
      .name { fill: #e6edf3; }
      .name.pill-text { fill: #0d1117; }
      .label, .legend { fill: #8b949e; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="939" rx="12"/>

  <!-- ===== Edges: always (solid) ===== -->
  <g class="edge" marker-end="url(#arrow)">
    <path d="M480,56 V95"/>                  <!-- START -> contextualize -->
    <path d="M480,135 V175"/>                <!-- contextualize -> decide_retrieval -->
    <path d="M480,305 V365"/>                <!-- retrieve -> grade -->
    <path d="M480,500 V545"/>                <!-- generate -> support -->
    <path d="M480,790 V834"/>                <!-- commit_memory -> END -->
    <path d="M665,285 H575"/>                <!-- rewrite_internal -> retrieve -->
    <path d="M665,378 H575"/>                <!-- web_search -> grade -->
    <path d="M750,455 V405"/>                <!-- rewrite_web -> web_search -->
    <path d="M245,545 V522 H420 V545"/>      <!-- revise -> support -->
    <path d="M130,305 V770 H385"/>           <!-- direct -> commit_memory -->
    <path d="M665,770 H575"/>                <!-- no_answer -> commit_memory -->
  </g>

  <!-- ===== Edges: decisions made by route_after_* (dashed) ===== -->
  <g class="edge cond" marker-end="url(#arrow)">
    <path d="M385,195 H130 V265"/>           <!-- decide_retrieval -> direct -->
    <path d="M480,215 V265"/>                <!-- decide_retrieval -> retrieve -->
    <path d="M480,405 V460"/>                <!-- grade -> generate -->
    <path d="M480,585 V635"/>                <!-- support -> usefulness -->
    <path d="M480,675 V750"/>                <!-- usefulness -> commit_memory -->
    <path d="M385,565 H295"/>                <!-- support -> revise -->
    <path d="M620,565 H716"/>                <!-- shared retry router -->
    <path d="M750,531 V495"/>                <!-- retry -> rewrite_web -->
    <path d="M784,565 H900 V285 H835"/>      <!-- retry -> rewrite_internal -->
    <path d="M750,599 V750"/>                <!-- retry -> no_answer -->
  </g>
  <g class="edge cond">
    <path d="M575,394 H620 V565"/>           <!-- grade: nothing relevant -->
    <path d="M575,655 H620 V565"/>           <!-- usefulness: not useful -->
  </g>
  <circle class="head" cx="620" cy="565" r="3"/>

  <!-- ===== Edge labels ===== -->
  <text class="label" x="258" y="187" text-anchor="middle">no</text>
  <text class="label" x="490" y="244">yes</text>
  <text class="label" x="490" y="437">relevant</text>
  <text class="label" x="490" y="614">supported</text>
  <text class="label" x="490" y="716">useful</text>
  <text class="label" x="340" y="557" text-anchor="middle">unsupported</text>
  <text class="label" x="628" y="434">none relevant</text>
  <text class="label" x="628" y="630">not useful</text>
  <text class="label" x="758" y="518">web</text>
  <text class="label" x="893" y="430" text-anchor="end">internal</text>
  <text class="label" x="758" y="680">give up</text>

  <!-- ===== Nodes ===== -->
  <rect class="pill" x="430" y="24" width="100" height="32" rx="16"/>
  <text class="name pill-text" x="480" y="45">START</text>

  <rect class="mem" x="385" y="95" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="120">contextualize</text>

  <rect class="node" x="385" y="175" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="200">decide_retrieval</text>

  <rect class="node" x="55" y="265" width="150" height="40" rx="8"/>
  <text class="name" x="130" y="290">direct</text>

  <rect class="node" x="385" y="265" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="290">retrieve</text>

  <rect class="node" x="665" y="265" width="170" height="40" rx="8"/>
  <text class="name" x="750" y="290">rewrite_internal</text>

  <rect class="node" x="385" y="365" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="390">grade</text>

  <rect class="web" x="665" y="365" width="170" height="40" rx="8"/>
  <text class="name" x="750" y="390">web_search</text>

  <rect class="web" x="665" y="455" width="170" height="40" rx="8"/>
  <text class="name" x="750" y="480">rewrite_web</text>

  <rect class="node" x="385" y="460" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="485">generate</text>

  <rect class="node" x="195" y="545" width="100" height="40" rx="8"/>
  <text class="name" x="245" y="570">revise</text>

  <rect class="node" x="385" y="545" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="570">support</text>

  <polygon class="diamond" points="750,531 784,565 750,599 716,565"/>
  <text class="label" x="750" y="569" text-anchor="middle">retry?</text>

  <rect class="node" x="385" y="635" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="660">usefulness</text>

  <rect class="mem" x="385" y="750" width="190" height="40" rx="8"/>
  <text class="name" x="480" y="775">commit_memory</text>

  <rect class="node" x="665" y="750" width="170" height="40" rx="8"/>
  <text class="name" x="750" y="775">no_answer</text>

  <rect class="pill" x="430" y="834" width="100" height="32" rx="16"/>
  <text class="name pill-text" x="480" y="855">END</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40,906)">
    <path class="edge" d="M0,0 H34"/>
    <text class="legend" x="44" y="4">always</text>
    <path class="edge cond" d="M110,0 H144"/>
    <text class="legend" x="154" y="4">decision</text>
    <rect class="mem" x="236" y="-8" width="26" height="16" rx="4"/>
    <text class="legend" x="272" y="4">memory (SQLite)</text>
    <rect class="web" x="398" y="-8" width="26" height="16" rx="4"/>
    <text class="legend" x="434" y="4">web fallback (Tavily)</text>
    <polygon class="diamond" points="584,-9 593,0 584,9 575,0"/>
    <text class="legend" x="602" y="4">retry: internal first, then web, then give up</text>
  </g>
</svg>
